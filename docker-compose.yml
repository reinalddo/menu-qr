# menu-qr — default deployment: one public port, no domain needed.
# Works on its own: every value has a default and nothing is read from the repo.
name: menu-qr

services:
  init:
    image: ghcr.io/reinalddo/menu-qr:1.0.0
    command: ["init-secrets"]
    environment:
      # Optional. Leave empty to generate a random password on the first start.
      MENUQR_DB_PASSWORD: ${MENUQR_DB_PASSWORD:-}
      MENUQR_DB_ROOT_PASSWORD: ${MENUQR_DB_ROOT_PASSWORD:-}
    volumes:
      - secrets:/run/menuqr
    restart: "no"

  db:
    image: mysql:8.4.11
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=40
    environment:
      MYSQL_DATABASE: menuqr
      MYSQL_USER: menuqr
      MYSQL_PASSWORD_FILE: /run/menuqr/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/menuqr/db_root_password
    volumes:
      - db_data:/var/lib/mysql
      - secrets:/run/menuqr:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/menuqr/db_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  app:
    image: ghcr.io/reinalddo/menu-qr:1.0.0
    ports:
      - "${APP_PORT:-8101}:80"
    environment:
      APP_PORT: ${APP_PORT:-8101}
      # Set to 1 to print a password recovery code in the logs; set back to 0 afterwards.
      MENUQR_RECOVERY: ${MENUQR_RECOVERY:-0}
    volumes:
      - app_data:/var/www/data
      - secrets:/run/menuqr:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  app_data:
  secrets:
