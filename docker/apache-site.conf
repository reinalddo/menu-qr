ServerName localhost
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    # Health checks every few seconds would bury the setup code in the logs.
    SetEnvIf Request_URI "^/healthz$" dontlog
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!dontlog

    <Directory /var/www/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Uploaded photos: served directly, never executed, only .webp files.
    Alias /media/ /var/www/data/uploads/
    <Directory /var/www/data/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        php_admin_flag engine off
        Require all denied
        <FilesMatch "\.webp$">
            Require all granted
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
</VirtualHost>
